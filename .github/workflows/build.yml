name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev \
          python3-pip
        pip3 install --upgrade pip
        pip3 install buildozer
        pip3 install cython
    
    - name: Create placeholder icon
      run: |
        mkdir -p assets
        echo "iVBORw0KGgoAAAANSUhEUgAAAgAAAAIAAQMAAADOtka5AAAAA1BMVEWzMzPfXzTqAAAANklEQVR42u3BAQ0AAADCoPdPbQ8HFAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/AY1+QABhKhmLAAAAABJRU5ErkJggg==" | base64 -d > assets/icon.png
    
    - name: Build APK
      env:
        ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      run: |
        buildozer android debug deploy
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Tamagotchi-APK
        path: bin/*.apk
        if-no-files-found: error
